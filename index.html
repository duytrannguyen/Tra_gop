<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Công cụ tính góp HD SAISON</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --hds-red: #d71920;
            --hds-blue: #213a8f;
        }

        body {
            min-height: 100vh;
            background: #f4f7fb;
        }

        .page-container {
            width: min(100% - 24px, 1280px);
            margin-inline: auto;
            padding-block: clamp(12px, 4vw, 48px);
        }

        .calculator {
            width: 100%;
            max-width: 1180px;
            overflow: hidden;
            border: 0;
            border-radius: clamp(14px, 2vw, 24px);
            box-shadow: 0 16px 45px rgba(25, 45, 90, .12);
        }

        .hds-header {
            background: linear-gradient(135deg, var(--hds-red), var(--hds-blue));
        }

        .hds-header h1 {
            font-size: clamp(1.55rem, 4vw, 2.5rem);
        }

        .hds-header p {
            font-size: clamp(.9rem, 2vw, 1.05rem);
        }

        .calculator-body {
            padding: clamp(16px, 4vw, 48px);
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--hds-blue);
            box-shadow: 0 0 0 .25rem rgba(33, 58, 143, .12);
        }

        .monthly-payment {
            color: var(--hds-red);
            font-size: clamp(1.75rem, 5vw, 3rem);
            line-height: 1.15;
            overflow-wrap: anywhere;
        }

        .result-card {
            min-height: 100%;
            background: #fff;
            border: 1px solid #e7ebf2;
        }

        .result-card strong {
            overflow-wrap: anywhere;
        }

        .result-panel {
            height: 100%;
        }

        .note-box {
            background: #fff7ed;
            border-left: 5px solid #f97316;
        }

        .btn-hds {
            color: #fff;
            background: var(--hds-red);
            border-color: var(--hds-red);
        }

        .btn-hds:hover,
        .btn-hds:focus {
            color: #fff;
            background: #b71218;
            border-color: #b71218;
        }

        @media (min-width: 992px) {
            .calculator-content {
                display: grid;
                grid-template-columns: minmax(310px, .85fr) minmax(500px, 1.35fr);
                gap: clamp(24px, 4vw, 48px);
                align-items: stretch;
            }

            .result-panel {
                margin-top: 0 !important;
            }
        }

        @media (max-width: 575.98px) {
            .page-container {
                width: 100%;
                padding: 0;
            }

            .calculator {
                min-height: 100vh;
                border-radius: 0;
                box-shadow: none;
            }

            .hds-header {
                padding: 24px 16px !important;
            }

            .calculator-body {
                padding: 16px;
            }

            .form-control-lg,
            .form-select-lg,
            .input-group-lg > .form-control,
            .input-group-lg > .input-group-text {
                min-height: 48px;
                padding: .625rem .75rem;
                font-size: 1rem;
            }

            .btn-lg {
                padding: .75rem 1rem;
                font-size: 1rem;
            }

            .note-box {
                font-size: .9rem;
            }
        }
    </style>
</head>
<body>
    <main class="page-container">
        <div id="root"></div>
    </main>

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useEffect, useMemo, useState } = React;

        const HDS_DATA = {
            2000000: { 6: 411000, 9: 295000 },
            3000000: { 6: 610000, 9: 436000 },
            4000000: { 6: 809000, 9: 578000, 12: 462000, 15: 396000, 18: 352000 },
            5000000: { 6: 1008000, 9: 719000, 12: 574000, 15: 491000, 18: 436000 },
            6000000: { 6: 1207000, 9: 860000, 12: 686000, 15: 587000, 18: 521000 },
            7000000: { 6: 1406000, 9: 1002000, 12: 799000, 15: 683000, 18: 606000 },
            8000000: { 6: 1605000, 9: 1143000, 12: 911000, 15: 779000, 18: 691000 },
            9000000: { 6: 1804000, 9: 1284000, 12: 1023000, 15: 874000, 18: 775000 },
            10000000: { 6: 2003000, 9: 1426000, 12: 1136000, 15: 970000, 18: 860000 },
            11000000: { 6: 2202000, 9: 1567000, 12: 1248000, 15: 1066000, 18: 945000 },
            12000000: { 6: 2401000, 9: 1708000, 12: 1360000, 15: 1162000, 18: 1030000 },
            13000000: { 6: 2600000, 9: 1850000, 12: 1473000, 15: 1257000, 18: 1114000 },
            14000000: { 6: 2799000, 9: 1991000, 12: 1585000, 15: 1353000, 18: 1199000 },
            15000000: { 6: 2998000, 9: 2132000, 12: 1697000, 15: 1449000, 18: 1284000 },
            16000000: { 6: 3198000, 9: 2273000, 12: 1810000, 15: 1545000, 18: 1369000 },
            17000000: { 6: 3397000, 9: 2415000, 12: 1922000, 15: 1641000, 18: 1453000 },
            18000000: { 6: 3596000, 9: 2556000, 12: 2034000, 15: 1736000, 18: 1538000 },
            19000000: { 6: 3795000, 9: 2697000, 12: 2147000, 15: 1832000, 18: 1623000 },
            20000000: { 6: 3994000, 9: 2839000, 12: 2259000, 15: 1928000, 18: 1708000 },
            21000000: { 6: 4193000, 9: 2980000, 12: 2371000, 15: 2024000, 18: 1792000 },
            22000000: { 6: 4392000, 9: 3121000, 12: 2484000, 15: 2119000, 18: 1877000 },
            23000000: { 6: 4591000, 9: 3263000, 12: 2596000, 15: 2215000, 18: 1962000 },
            24000000: { 6: 4790000, 9: 3404000, 12: 2708000, 15: 2311000, 18: 2047000 },
            25000000: { 6: 4989000, 9: 3545000, 12: 2821000, 15: 2407000, 18: 2131000 },
            26000000: { 6: 5188000, 9: 3687000, 12: 2933000, 15: 2502000, 18: 2216000 },
            27000000: { 6: 5387000, 9: 3828000, 12: 3045000, 15: 2598000, 18: 2301000 },
            28000000: { 6: 5586000, 9: 3969000, 12: 3158000, 15: 2694000, 18: 2386000 },
            29000000: { 6: 5785000, 9: 4111000, 12: 3270000, 15: 2790000, 18: 2470000 },
            30000000: { 6: 5984000, 9: 4252000, 12: 3382000, 15: 2885000, 18: 2555000 }
        };

        const TERM_RATES = {
            6: 0.0324,
            9: 0.0302,
            12: 0.029,
            15: 0.0291,
            18: 0.0292
        };
        const MONTHLY_FEE = 12000;
        const TERMS = [6, 9, 12, 15, 18];
        const MIN_AMOUNT = 2000000;
        const MAX_AMOUNT = 30000000;
        const roundupToThousand = (value) => Math.ceil(value / 1000) * 1000;

        const formatNumber = (value) => value ? Number(value).toLocaleString("vi-VN") : "";
        const formatMoney = (value) => `${Math.round(value).toLocaleString("vi-VN")} đ`;

        function getMonthlyPayment(amount, term) {
            if (amount < MIN_AMOUNT || amount > MAX_AMOUNT) {
                return null;
            }

            const exactMonthly = HDS_DATA[amount]?.[term];
            if (exactMonthly) {
                return exactMonthly;
            }

            const rate = TERM_RATES[term];
            if (!rate) {
                return null;
            }

            return roundupToThousand((amount / term) + (amount * rate) + MONTHLY_FEE);
        }

        function App() {
            const [amount, setAmount] = useState(10000000);
            const [term, setTerm] = useState(12);
            const initialPayment = getMonthlyPayment(10000000, 12);
            const [result, setResult] = useState({
                amount: 10000000,
                term: 12,
                monthly: initialPayment
            });
            const [error, setError] = useState("");

            const availableTerms = useMemo(
                () => amount >= 4000000 ? TERMS : [6, 9],
                [amount]
            );

            useEffect(() => {
                if (!availableTerms.includes(term)) setTerm(availableTerms[0]);
            }, [availableTerms, term]);

            const handleAmountChange = (event) => {
                const digits = event.target.value.replace(/\D/g, "");
                setAmount(digits ? Number(digits) : 0);
                setError("");
            };

            const calculateLoan = (event) => {
                event.preventDefault();

                if (amount < MIN_AMOUNT || amount > MAX_AMOUNT) {
                    setError("Vui lòng nhập khoản vay từ 2.000.000 đ đến 30.000.000 đ.");
                    return;
                }

                const monthly = getMonthlyPayment(amount, term);
                if (monthly === null) {
                    setError("Kỳ hạn này không áp dụng cho khoản vay đã nhập.");
                    return;
                }

                setError("");
                setResult({
                    amount,
                    term,
                    monthly
                });
            };

            return (
                <section className="card calculator mx-auto">
                    <header className="hds-header text-white text-center px-3 py-4 py-md-5">
                        <h1 className="fw-bold mb-2">TÍNH GÓP HD SAISON</h1>
                        <p className="mb-0 opacity-75">
                            Áp dụng theo bảng trả góp HD SAISON tại cửa hàng
                        </p>
                    </header>

                    <div className="card-body calculator-body">
                        <div className="calculator-content">
                        <form onSubmit={calculateLoan} className="align-self-start">
                            <div className="row g-4">
                                <div className="col-12">
                                    <label htmlFor="loanAmount" className="form-label fw-semibold">
                                        Số tiền cần vay
                                    </label>
                                    <div className="input-group input-group-lg">
                                        <input
                                            id="loanAmount"
                                            className={`form-control ${error ? "is-invalid" : ""}`}
                                            type="text"
                                            inputMode="numeric"
                                            value={formatNumber(amount)}
                                            onChange={handleAmountChange}
                                            placeholder="Nhập số tiền cần vay"
                                            aria-describedby="amountHelp"
                                        />
                                        <span className="input-group-text">đ</span>
                                    </div>
                                    <div id="amountHelp" className="form-text">
                                        Từ 2.000.000 đ đến 30.000.000 đ. Khoản nhập lẻ sẽ được tính trực tiếp theo đúng số tiền bạn nhập.
                                    </div>
                                </div>

                                <div className="col-12">
                                    <label htmlFor="loanTerm" className="form-label fw-semibold">
                                        Kỳ hạn trả góp
                                    </label>
                                    <select
                                        id="loanTerm"
                                        className="form-select form-select-lg"
                                        value={term}
                                        onChange={(event) => setTerm(Number(event.target.value))}
                                    >
                                        {availableTerms.map(item => (
                                            <option key={item} value={item}>{item} tháng</option>
                                        ))}
                                    </select>
                                    <div className="form-text">
                                        Khoản vay dưới 4 triệu áp dụng 6 hoặc 9 tháng
                                    </div>
                                </div>
                            </div>

                            {error && <div className="alert alert-danger mt-4 mb-0">{error}</div>}

                            <button type="submit" className="btn btn-hds btn-lg fw-bold w-100 mt-4">
                                TÍNH KHOẢN GÓP
                            </button>
                        </form>

                        <section className="result-panel bg-light border rounded-4 p-3 p-md-4 mt-4" aria-live="polite">
                            <p className="text-secondary mb-1">Số tiền phải góp mỗi tháng</p>
                            <div className="monthly-payment fw-bold mb-4">
                                {formatMoney(result.monthly)}
                            </div>

                            <div className="row g-3">
                                <ResultCard label="Khoản vay" value={formatMoney(result.amount)} />
                                <ResultCard label="Kỳ hạn" value={`${result.term} tháng`} />
                                <ResultCard
                                    label="Tổng góp dự kiến"
                                    value={formatMoney(result.monthly * result.term)}
                                />
                            </div>

                            <div className="note-box rounded-3 p-3 mt-4">
                                <p className="mb-1"><strong>Thủ tục dưới 20 triệu:</strong> CMND hoặc CCCD gắn chip.</p>
                                <p className="mb-1"><strong>Trên 20 triệu:</strong> liên hệ nhân viên để được tư vấn.</p>
                                <p className="mb-0"><strong>Lưu ý:</strong> Khoản vay tròn triệu sẽ khớp bảng HD SAISON, khoản vay lẻ được tính trực tiếp theo cùng công thức lãi của bảng.</p>
                            </div>
                        </section>
                        </div>
                    </div>
                </section>
            );
        }

        function ResultCard({ label, value }) {
            return (
                <div className="col-sm-6 col-xl-4">
                    <div className="result-card rounded-3 p-3">
                        <span className="d-block small text-secondary mb-1">{label}</span>
                        <strong className="fs-5">{value}</strong>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
</body>
</html>
